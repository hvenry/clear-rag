[project]
name = "clear-rag"
version = "0.1.0"
description = "A local-first RAG system whose retrieval process is visible."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
rerank = [
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
clear-rag = "clearrag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# Deliberately unpinned: pinning to 3.11 while running under a newer interpreter makes
# mypy reject third-party stubs (numpy's, for one) that use newer syntax.
# Without the pydantic plugin, mypy cannot see that model fields have defaults and
# reports every construction as missing arguments.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
